[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "melanoma_cls"
version = "0.0.1"
description = "Exploring transfer learning and staged fine-tuning of different architectures for melanoma classification"
authors = [
  { name = "Jesse" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["melanoma_cls"]
include = ["pyproject.toml", "melanoma_cls/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["melanoma_cls"]
force-sort-within-sections = true

